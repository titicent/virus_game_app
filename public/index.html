<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5C56">
<title>VIRUS! en línea</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:#EDF1F0;color:#16211F;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
header{background:#2E5C56;color:#F2F6F4;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
header h1{font-size:15px;font-weight:750;margin:0;letter-spacing:-.3px;flex:1}
.sala{font-size:12px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:20px;letter-spacing:1px}
.wrap{padding:12px;max-width:760px;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:12px;padding:13px;margin-bottom:11px;box-shadow:0 1px 2px rgba(20,40,36,.1)}
.h{font-size:12px;font-weight:700;color:#5A6B67;margin:0 0 9px}
.note{font-size:12px;line-height:1.55;color:#5F706C;background:#F5F8F7;border-radius:9px;padding:10px;margin:0}
.btn{border:0;border-radius:9px;background:#2E5C56;color:#fff;padding:11px 15px;font-size:13.5px;font-weight:650}
.btn.ghost{background:#E2EAE7;color:#2A3A37}
.btn.warn{background:#F1EDE6;color:#7A6540}
.btn.big{width:100%;padding:15px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{border:1px solid #C9D5D1;border-radius:9px;padding:11px;font-size:15px;width:100%;background:#fff;font-family:inherit}
.input.cod{text-transform:uppercase;letter-spacing:5px;text-align:center;font-weight:750;font-size:22px}
.sw{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:#3B4E4A;margin-bottom:9px}
/* mesa */
.jug{border-left:4px solid #CBD6D2;padding:0 0 0 10px;margin-bottom:11px}
.jug.turno{border-left-color:#C93A3A}
.jug.yo{border-left-color:#2E5C56}
.nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:650;background:#E4ECE9;color:#3B4E4A;padding:2px 7px;border-radius:20px}
.pill.hot{background:#FBE3E3;color:#A32B2B}
.pill.off{background:#EFEFEF;color:#9AA3A0}
.organs{display:flex;flex-wrap:wrap;gap:5px;min-height:8px}
.org{border:0;border-radius:9px;padding:6px 8px;color:#fff;font-size:11.5px;font-weight:650;
  text-align:left;line-height:1.2;min-width:84px;position:relative}
.org small{display:block;font-weight:500;font-size:10px;opacity:.92}
.org.sick{filter:saturate(.35);border:2px dashed rgba(255,255,255,.8)}
.org.obj{outline:3px solid #F2B705;outline-offset:2px}
.vacio{font-size:11.5px;color:#9AA3A0;padding:5px 0}
/* mano */
.mano{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.carta{border:0;border-radius:11px;padding:11px 9px;min-height:84px;color:#fff;font-size:12px;
  font-weight:650;line-height:1.3;text-align:left;position:relative}
.carta.sel{outline:3px solid #16211F;outline-offset:2px}
.carta.muerta{opacity:.42}
.carta .n{font-size:9.5px;font-weight:700;opacity:.8;display:block;margin-bottom:3px;letter-spacing:.5px}
.opciones{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.opc{border:1.5px solid #2E5C56;background:#F2F7F5;color:#1B2A27;border-radius:9px;padding:10px;
  font-size:13px;font-weight:600;text-align:left}
.turnobar{background:#1F4B45;color:#EAF3F0;border-radius:11px;padding:12px 14px;margin-bottom:11px}
.turnobar b{font-size:15px;display:block}
.turnobar span{font-size:12.5px;opacity:.85}
.turnobar.esperando{background:#4A5C58}
.sug{background:#F1EEF8;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;color:#3E3562;margin-top:9px}
.reg{font-size:12px;line-height:1.6;color:#4A5A56;margin:0}
.reg div{padding:2px 0;border-top:1px solid #F0F4F3}
.reg div:first-child{border-top:0}
.mask{position:fixed;inset:0;background:rgba(15,30,27,.55);display:flex;align-items:center;
  justify-content:center;z-index:60;padding:16px}
.sheet{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto}
.sheet h4{margin:0 0 5px;font-size:17px;font-weight:750}
.sheet p{margin:0 0 14px;font-size:13px;line-height:1.5;color:#4A5A56}
.cuenta{font-size:26px;font-weight:800;color:#C93A3A;text-align:center;margin:6px 0 12px}
.gana{background:#1F4B45;color:#EAF3F0;border-radius:12px;padding:18px;text-align:center;margin-bottom:11px}
.gana b{font-size:20px;display:block;margin-bottom:4px}
.err{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
  background:#7A2E2E;color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;z-index:70;text-align:center}
</style>
</head>
<body>
<header><h1>VIRUS! en línea</h1><span class="sala" id="cod"></span></header>
<main class="wrap" id="app"></main>
<div id="modal"></div>
<script src="reglas.js"></script>
<script src="cliente.js"></script>
</body>
</html>
